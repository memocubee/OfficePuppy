<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- C: a puppy holding its punch card in its mouth -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A4A00" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <g clip-path="url(#tile)">
    <!-- floppy ears -->
    <path d="M290 300 C200 320 190 500 230 600 C256 660 320 650 340 590 C360 520 350 400 360 340 Z" fill="#B97A4A"/>
    <path d="M734 300 C824 320 834 500 794 600 C768 660 704 650 684 590 C664 520 674 400 664 340 Z" fill="#B97A4A"/>
    <!-- head -->
    <ellipse cx="512" cy="470" rx="220" ry="200" fill="#FFF6EA"/>
    <!-- eye patch -->
    <ellipse cx="600" cy="430" rx="70" ry="62" fill="#E9C9A6"/>
    <!-- eyes -->
    <ellipse cx="430" cy="440" rx="26" ry="32" fill="#2B2118"/>
    <ellipse cx="598" cy="440" rx="26" ry="32" fill="#2B2118"/>
    <circle cx="439" cy="429" r="8" fill="#FFFFFF"/>
    <circle cx="607" cy="429" r="8" fill="#FFFFFF"/>
    <!-- nose -->
    <path d="M480 520 Q514 502 548 520 Q542 552 514 560 Q486 552 480 520 Z" fill="#2B2118"/>
    <!-- punch card, tilted, held under the nose -->
    <g transform="rotate(-8 512 680)" filter="url(#soft)">
      <rect x="352" y="590" width="320" height="200" rx="18" fill="#FFFFFF"/>
      <rect x="352" y="590" width="320" height="46" rx="18" fill="#E5484D"/>
      <rect x="352" y="616" width="320" height="20" fill="#E5484D"/>
      <g fill="#D6DCE6">
        <rect x="384" y="660" width="256" height="14" rx="7"/>
        <rect x="384" y="694" width="200" height="14" rx="7"/>
        <rect x="384" y="728" width="230" height="14" rx="7"/>
      </g>
      <circle cx="640" cy="760" r="12" fill="#2B2118"/>
    </g>
    <!-- muzzle over the card edge, so it reads as "in the mouth" -->
    <ellipse cx="514" cy="590" rx="92" ry="40" fill="#FFF6EA"/>
    <path d="M462 588 Q514 612 566 588" stroke="#2B2118" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
</svg>
