<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Office Puppy 圖示提案</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang TC", sans-serif; background: #F4F5F8; color: #1A1C1F; }
  .wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 32px 32px 16px; }
  .card { background: #FFFFFF; border-radius: 16px; padding: 24px 16px 16px; text-align: center; }
  .card h2 { margin: 12px 0 4px; font-size: 22px; font-weight: 600; }
  .card p { margin: 0; font-size: 15px; color: #5B6170; }
  .big { width: 280px; height: 280px; }
  .dock { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-top: 16px; padding: 12px; border-radius: 12px; }
  .light { background: #E9EBF0; }
  .dark { background: #1F2025; }
  .dock img:nth-child(1) { width: 64px; } .dock img:nth-child(2) { width: 32px; } .dock img:nth-child(3) { width: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="big" src="a-shiba-tie.svg" alt="">
    <h2>A　打領帶的柴犬</h2>
    <p>一看就是「上班的小狗」</p>
    <div class="dock light"><img src="a-shiba-tie.svg" alt=""><img src="a-shiba-tie.svg" alt=""><img src="a-shiba-tie.svg" alt=""></div>
    <div class="dock dark"><img src="a-shiba-tie.svg" alt=""><img src="a-shiba-tie.svg" alt=""><img src="a-shiba-tie.svg" alt=""></div>
  </div>
  <div class="card">
    <img class="big" src="b-clock-pup.svg" alt="">
    <h2>B　狗臉時鐘</h2>
    <p>留著原本的紫色時鐘，加上狗耳朵</p>
    <div class="dock light"><img src="b-clock-pup.svg" alt=""><img src="b-clock-pup.svg" alt=""><img src="b-clock-pup.svg" alt=""></div>
    <div class="dock dark"><img src="b-clock-pup.svg" alt=""><img src="b-clock-pup.svg" alt=""><img src="b-clock-pup.svg" alt=""></div>
  </div>
  <div class="card">
    <img class="big" src="c-punch-card.svg" alt="">
    <h2>C　叼著打卡卡片</h2>
    <p>小狗自己來打卡</p>
    <div class="dock light"><img src="c-punch-card.svg" alt=""><img src="c-punch-card.svg" alt=""><img src="c-punch-card.svg" alt=""></div>
    <div class="dock dark"><img src="c-punch-card.svg" alt=""><img src="c-punch-card.svg" alt=""><img src="c-punch-card.svg" alt=""></div>
  </div>
</div>
</body>
</html>
