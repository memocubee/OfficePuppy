<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- B: the original indigo clock, turned into a puppy face -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <!-- floppy ears -->
  <path d="M300 330 C220 330 196 470 220 600 C236 680 300 690 330 640 C356 590 352 450 352 380 Z" fill="#8B5A3C" filter="url(#soft)"/>
  <path d="M724 330 C804 330 828 470 804 600 C788 680 724 690 694 640 C668 590 672 450 672 380 Z" fill="#8B5A3C" filter="url(#soft)"/>
  <!-- clock face -->
  <circle cx="512" cy="540" r="270" fill="#FFFFFF" filter="url(#soft)"/>
  <!-- hour ticks -->
  <g stroke="#C7D2FE" stroke-width="16" stroke-linecap="round">
    <line x1="512" y1="300" x2="512" y2="330"/>
    <line x1="752" y1="540" x2="722" y2="540"/>
    <line x1="512" y1="780" x2="512" y2="750"/>
    <line x1="272" y1="540" x2="302" y2="540"/>
  </g>
  <!-- eyes -->
  <ellipse cx="432" cy="470" rx="26" ry="32" fill="#1E1B4B"/>
  <ellipse cx="592" cy="470" rx="26" ry="32" fill="#1E1B4B"/>
  <circle cx="441" cy="459" r="8" fill="#FFFFFF"/>
  <circle cx="601" cy="459" r="8" fill="#FFFFFF"/>
  <!-- clock hands come out of the nose: 10 o'clock -->
  <line x1="512" y1="580" x2="512" y2="372" stroke="#4338CA" stroke-width="18" stroke-linecap="round"/>
  <line x1="512" y1="580" x2="420" y2="628" stroke="#4338CA" stroke-width="22" stroke-linecap="round"/>
  <!-- nose as the pivot -->
  <path d="M474 570 Q512 552 550 570 Q544 608 512 616 Q480 608 474 570 Z" fill="#1E1B4B"/>
  <!-- tongue -->
  <path d="M492 660 Q512 650 532 660 L532 690 Q512 712 492 690 Z" fill="#FF8A9A"/>
  <path d="M470 646 Q512 676 554 646" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
