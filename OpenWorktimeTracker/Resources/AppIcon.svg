<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A: office shiba wearing a tie -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DB4FF"/>
      <stop offset="1" stop-color="#3D6FE0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <g clip-path="url(#tile)">
    <!-- shirt -->
    <path d="M262 924 Q290 760 512 742 Q734 760 762 924 Z" fill="#FFFFFF"/>
    <!-- collar -->
    <path d="M430 752 L512 812 L470 850 Z" fill="#E8EEF8"/>
    <path d="M594 752 L512 812 L554 850 Z" fill="#E8EEF8"/>
    <!-- tie -->
    <path d="M490 806 L534 806 L546 836 L512 860 L478 836 Z" fill="#E5484D"/>
    <path d="M486 852 L512 860 L538 852 L560 924 L464 924 Z" fill="#E5484D"/>
    <!-- ears -->
    <path d="M268 470 L300 230 L452 372 Z" fill="#E9963F"/>
    <path d="M312 420 L322 300 L408 382 Z" fill="#FBE3C4"/>
    <path d="M756 470 L724 230 L572 372 Z" fill="#E9963F"/>
    <path d="M712 420 L702 300 L616 382 Z" fill="#FBE3C4"/>
    <!-- head -->
    <ellipse cx="512" cy="560" rx="262" ry="232" fill="#F2A54A"/>
    <!-- cream mask -->
    <path d="M512 520 C430 520 382 560 352 612 C330 660 360 760 512 774 C664 760 694 660 672 612 C642 560 594 520 512 520 Z" fill="#FFF4E2"/>
    <!-- eyebrow dots -->
    <ellipse cx="420" cy="462" rx="26" ry="16" fill="#FFF4E2"/>
    <ellipse cx="604" cy="462" rx="26" ry="16" fill="#FFF4E2"/>
    <!-- eyes -->
    <ellipse cx="420" cy="528" rx="28" ry="34" fill="#2B2118"/>
    <ellipse cx="604" cy="528" rx="28" ry="34" fill="#2B2118"/>
    <circle cx="430" cy="516" r="9" fill="#FFFFFF"/>
    <circle cx="614" cy="516" r="9" fill="#FFFFFF"/>
    <!-- nose and mouth -->
    <path d="M478 612 Q512 594 546 612 Q540 646 512 654 Q484 646 478 612 Z" fill="#2B2118"/>
    <path d="M512 654 L512 676 M512 676 Q486 702 462 684 M512 676 Q538 702 562 684" stroke="#2B2118" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- blush -->
    <ellipse cx="370" cy="640" rx="34" ry="20" fill="#FF9AA2" opacity="0.55"/>
    <ellipse cx="654" cy="640" rx="34" ry="20" fill="#FF9AA2" opacity="0.55"/>
  </g>
</svg>
