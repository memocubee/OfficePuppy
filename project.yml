name: OfficePuppy
options:
  bundleIdPrefix: com.memocubee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  knownRegions:
    - en
    - de
    - zh-Hant
  defaultLocalization: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  OfficePuppy:
    type: application
    platform: macOS
    sources:
      - path: OfficePuppy
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memocubee.officepuppy
        PRODUCT_NAME: OfficePuppy
        DEVELOPMENT_TEAM: 8WEDM868L3
        MARKETING_VERSION: "0.8.2"
        CURRENT_PROJECT_VERSION: "8002"
        INFOPLIST_FILE: OfficePuppy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OfficePuppy/Resources/OfficePuppy.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: Sparkle
        product: Sparkle
      - target: OfficePuppyWidgetExtension

  OfficePuppyWidgetExtension:
    type: extensionkit-extension
    platform: macOS
    product: OfficePuppyWidget
    sources:
      - path: OfficePuppyWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memocubee.officepuppy.widget
        PRODUCT_NAME: OfficePuppyWidget
        DEVELOPMENT_TEAM: 8WEDM868L3
        MARKETING_VERSION: "0.8.2"
        CURRENT_PROJECT_VERSION: "8002"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: OfficePuppyWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OfficePuppyWidget/OfficePuppyWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks
          @executable_path/../../../../Frameworks"

  OfficePuppyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OfficePuppyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memocubee.officepuppy.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: OfficePuppy
